name: Build Aion Runtime candidates

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - runtimes/runtime-sources.lock.json

permissions:
  contents: read

concurrency:
  group: aion-runtime-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Aion CLI (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-15
            binary-name: aioncore
          - platform: darwin-x64
            runner: macos-13
            binary-name: aioncore
          - platform: win32-x64
            runner: windows-2025
            binary-name: aioncore.exe
          - platform: linux-x64
            runner: ubuntu-22.04
            binary-name: aioncore
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.0
          cache: npm
      - run: npm ci
      - id: version
        shell: bash
        run: echo "value=$(node -p \"require('./runtimes/runtime-sources.lock.json').aionCli.artifactVersion\")" >> "$GITHUB_OUTPUT"
      - name: Install locked Rust toolchain
        if: matrix.platform != 'linux-x64'
        shell: bash
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
      - name: Build Aion CLI on macOS or Windows
        if: matrix.platform != 'linux-x64'
        shell: bash
        run: |
          node scripts/build-aion-runtime-binary.mjs \
            --platform ${{ matrix.platform }} \
            --output build/native/${{ matrix.platform }}/${{ matrix.binary-name }} \
            --license-output build/native/${{ matrix.platform }}/AionCore-LICENSE.txt
      - name: Build Aion CLI against manylinux 2.28
        if: matrix.platform == 'linux-x64'
        shell: bash
        run: |
          docker build -f scripts/Dockerfile.aioncore-linux-x64 -t xmos-aion-linux-x64 .
          docker run --rm -v "$PWD:/workspace" xmos-aion-linux-x64 scripts/build-aion-runtime-binary.mjs \
            --platform linux-x64 \
            --output build/native/linux-x64/aioncore \
            --license-output build/native/linux-x64/AionCore-LICENSE.txt
      - name: Prepare unsigned Runtime payload
        shell: bash
        run: |
          node scripts/prepare-aion-runtime-payload.mjs \
            --platform ${{ matrix.platform }} \
            --binary build/native/${{ matrix.platform }}/${{ matrix.binary-name }} \
            --binary-provenance build/native/${{ matrix.platform }}/${{ matrix.binary-name }}.provenance.json \
            --license build/native/${{ matrix.platform }}/AionCore-LICENSE.txt \
            --output build/runtime-payloads/aion-cli/${{ matrix.platform }}
      - name: Verify unsigned Runtime payload
        shell: bash
        run: |
          node scripts/verify-runtime-payload.mjs \
            --runtime aion-cli \
            --platform ${{ matrix.platform }} \
            --payload-root build/runtime-payloads/aion-cli/${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-candidate-aion-cli-${{ matrix.platform }}
          path: build/runtime-payloads/aion-cli/${{ matrix.platform }}
          include-hidden-files: true
          retention-days: 14
      - uses: ./.github/actions/upload-minio
        with:
          source-path: build/runtime-payloads/aion-cli/${{ matrix.platform }}
          destination: candidates/aion-cli/${{ steps.version.outputs.value }}/${{ github.run_id }}/${{ matrix.platform }}
          endpoint: ${{ secrets.MINIO_ENDPOINT }}
          bucket: ${{ secrets.MINIO_BUCKET }}
          access-key: ${{ secrets.MINIO_ACCESS_KEY }}
          secret-key: ${{ secrets.MINIO_SECRET_KEY }}
          prefix: ${{ vars.MINIO_PREFIX || 'runtimes' }}
          insecure: ${{ vars.MINIO_INSECURE || 'false' }}
